[workspace]
members = [
    "crates/coalesce-core",
    "crates/coalesce-proxy",
    "crates/coalesce-cli",
    "desktop/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MichaelDanCurtis/Coalesce"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["trace", "cors", "limit", "fs"] }

# HTTP client
reqwest = { version = "0.12", features = ["stream", "json", "rustls-tls"] }

# Streaming
eventsource-stream = "0.2"
tokio-stream = { version = "0.1", features = ["sync"] }
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Metrics
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Utilities
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
bytes = "1"
dirs = "6"
async-trait = "0.1"
pdf_oxide = { version = "0.3", features = ["parallel"] }
tempfile = "3"
base64 = "0.22"
wasmtime = "29"

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Internal crates
coalesce-core = { path = "crates/coalesce-core" }
coalesce-proxy = { path = "crates/coalesce-proxy" }
